# Render Blueprint — deploys the 3 services from this repo.
# Push-to-deploy: any push to main auto-deploys.
#
# Secrets marked `sync: false` are left blank on purpose and MUST be set in the
# Render dashboard after the Blueprint is applied:
#   - chat-api / chat-ws: MONGODB_URI (Atlas), REDIS_URL (Upstash),
#     JWT_SECRET + JWT_REFRESH_SECRET (same value in both services)
#   - chat-client: API_URL / WS_URL → the public hostnames of the api/ws services
#     (no rebuild needed: nginx generates its proxy config at runtime)
services:
  # ---------- REST API ----------
  - type: web
    name: chat-api
    runtime: docker
    repo: https://github.com/namankhanda2/realtime-chat-platform
    dockerfilePath: ./api-server/Dockerfile
    dockerContext: ./api-server
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: ACCESS_TOKEN_TTL
        value: "15m"
      - key: REFRESH_TOKEN_TTL
        value: "7d"

  # ---------- WebSocket server ----------
  - type: web
    name: chat-ws
    runtime: docker
    repo: https://github.com/namankhanda2/realtime-chat-platform
    dockerfilePath: ./ws-server/Dockerfile
    dockerContext: ./ws-server
    envVars:
      - key: PORT
        value: 5001
      - key: MONGODB_URI
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: REDIS_ADAPTER
        value: "false"

  # ---------- React client (nginx static + proxy) ----------
  - type: web
    name: chat-client
    runtime: docker
    repo: https://github.com/namankhanda2/realtime-chat-platform
    dockerfilePath: ./client/Dockerfile
    dockerContext: ./client
    envVars:
      - key: API_URL
        sync: false
      - key: WS_URL
        sync: false