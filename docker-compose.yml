services:
  nginx:
    build: ./client
    container_name: chat-nginx
    ports:
      - "80:80"
    volumes:
      - ./client/nginx.conf:/etc/nginx/templates/nginx.conf:ro
    depends_on:
      - api
      - ws
    networks:
      - chat-net

  api:
    build: ./api-server
    container_name: chat-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/chat
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      ACCESS_TOKEN_TTL: 15m
      REFRESH_TOKEN_TTL: 7d
    volumes:
      - chat-uploads:/app/uploads
    depends_on:
      - mongo
      - redis
    networks:
      - chat-net

  ws:
    build: ./ws-server
    container_name: chat-ws
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5001
      MONGODB_URI: mongodb://mongo:27017/chat
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      REDIS_ADAPTER: "true"
    depends_on:
      - redis
      - mongo
    networks:
      - chat-net

  mongo:
    image: mongo:8
    container_name: chat-mongo
    restart: unless-stopped
    volumes:
      - chat-mongo-data:/data/db
    networks:
      - chat-net

  redis:
    image: redis:7-alpine
    container_name: chat-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - chat-redis-data:/data
    networks:
      - chat-net

volumes:
  chat-mongo-data:
  chat-redis-data:
  chat-uploads:

networks:
  chat-net:
    driver: bridge